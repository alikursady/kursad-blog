baseURL = "https://kursadyanik.com/"
languageCode = "tr-TR"
defaultContentLanguage = "tr"
title = "kursadyanik.com"
theme = "PaperMod"
buildFuture = false
enableRobotsTXT = true
rssLimit = 20
copyright = "Hiçbir hakkı saklı değildir."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Yapay zeka asistanlari icin duz metin icerik haritasi.
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms"]

[imaging]
  quality = 82
  resampleFilter = "Lanczos"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[frontmatter]
  lastmod = ["lastmod", "date", "publishDate"]

[params]
  env = "production"
  title = "kursadyanik.com"
  homeTitle = "blog | kursadyanik.com"
  author = "Kürşad Yanık"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  defaultTheme = "dark"
  disableThemeToggle = false
  disableSpecial1stPost = true

  description = "i have no idea what i'm doing"

  keywords = [
    "Kürşad Yanık",
    "siber güvenlik",
    "cybersecurity",
    "OSINT",
    "açık kaynak istihbaratı",
    "bilgi güvenliği",
    "CTF",
    "güvenlik araştırması",
    "CNC",
  ]

  # Tarih formatı: gönderi ve listelerde (gg.aa.yyyy)
  DateFormat = "02.01.2006"

# Yapısal veride (JSON-LD) kullanılan kayıt. Yalnızca ad ve yazıların konu
# başlıklarından oluşur, kişisel bilgi taşımaz.
[params.profile]
  name = "Kürşad Yanık"
  alternateNames = ["Kursad Yanik"]
  knowsAbout = [
    "siber güvenlik",
    "cybersecurity",
    "OSINT",
    "açık kaynak istihbaratı",
    "open source intelligence",
    "bilgi güvenliği",
    "information security",
    "CTF",
    "capture the flag",
    "güvenlik araştırması",
    "CNC",
    "talaşlı imalat",
    "kesici takım",
  ]

[params.label]
  text = "kursadyanik.com"

[params.assets]
  favicon = "favicon.ico"
  apple_touch_icon = "favicon.ico"
  safari_pinned_tab = "safari-pinned-tab.svg"
  theme_color = "#0f0f10"
  # Yazısı olmayan sayfalarda paylaşım görseli buradan üretilir.
  socialCover = "images/anime-bg.jpg"
