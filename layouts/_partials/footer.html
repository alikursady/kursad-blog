{{- if not (.Param "hideFooter") }}
<footer class="footer">
    <div class="footer-inner">
        <a class="footer-brand" href="{{ "" | absLangURL }}" aria-label="{{ site.Title }} ana sayfa">
            kursadyanik.com
        </a>
        <div class="footer-meta">
            {{ site.Copyright | default "Hiçbir hakkı saklı değildir." }}
        </div>
        <div class="footer-status" data-system-status data-state="checking">
            <span class="status-live-light" data-system-status-light aria-hidden="true"></span>
            <span class="status-copy">
                <span class="status-label">System Status</span>
                <span class="status-value" data-system-status-value aria-live="polite">Checking...</span>
                <span class="status-clock" data-system-clock aria-hidden="true">--:--:--</span>
            </span>
        </div>
    </div>
</footer>
{{- end }}

{{- if not site.Params.disableScrollToTop }}
<a href="#top" id="top-link" class="top-link hidden" aria-label="Sayfa başına dön" title="Sayfa başına dön (Alt + G)" accesskey="g">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="17 11 12 6 7 11"></polyline>
        <polyline points="17 18 12 13 7 18"></polyline>
    </svg>
</a>
{{- end }}
