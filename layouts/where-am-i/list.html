{{- define "main" -}}
<article class="canvas-page">
  <div class="canvas-stage" data-canvas>
    <div class="canvas-sheet">
      <span class="canvas-tape canvas-tape-tl" aria-hidden="true"></span>
      <span class="canvas-tape canvas-tape-tr" aria-hidden="true"></span>
      <span class="canvas-tape canvas-tape-bl" aria-hidden="true"></span>
      <span class="canvas-tape canvas-tape-br" aria-hidden="true"></span>

      <svg class="canvas-doodle canvas-doodle-spiral" width="120" height="120" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <path d="M74 34c-10-10-28-8-36 4-9 13-2 31 13 35 18 5 33-10 30-27-3-20-25-31-44-24C16 30 5 51 9 71c5 24 29 39 53 35" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>

      <svg class="canvas-doodle canvas-doodle-moon" width="86" height="86" viewBox="0 0 86 86" fill="none" aria-hidden="true">
        <path d="M56 10c-20 4-34 21-34 40 0 15 9 28 22 34-24 2-40-16-40-36C4 26 24 8 46 8c4 0 7 1 10 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M66 24l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>

      <svg class="canvas-doodle canvas-doodle-hatch" width="120" height="70" viewBox="0 0 120 70" fill="none" aria-hidden="true">
        <path d="M6 58L40 6M26 62L60 10M48 64L82 12M70 66L104 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>

      <header class="canvas-head">
        <h1 class="canvas-title">where am i</h1>
        <p class="canvas-sub">
          <span class="canvas-strike">about</span>
        </p>
      </header>

      <section class="canvas-block canvas-block-player" aria-label="Video">
        <svg class="canvas-doodle canvas-doodle-arrow" width="130" height="96" viewBox="0 0 130 96" fill="none" aria-hidden="true">
          <path d="M10 8c24 4 48 16 62 37 7 10 10 22 11 35" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          <path d="M70 66l13 15 10-13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="canvas-player">
          <span class="canvas-tape canvas-tape-player" aria-hidden="true"></span>
          <iframe width="560" height="315" src="https://www.youtube.com/embed/5UpIw6KUjbw?si=PUXVhSjVte0zpcFx" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>
        </div>
      </section>

      <section class="canvas-block canvas-block-window" aria-label="Pencere">
        <div class="night-window" data-window>
          <div class="window-frame">
            <div class="window-glass">
              <span class="window-moon" aria-hidden="true"></span>
              <span class="window-silhouette" data-silhouette aria-hidden="true"></span>
              <span class="window-rain" aria-hidden="true"></span>
              <span class="window-fog" aria-hidden="true"></span>
              <span class="window-bar-h" aria-hidden="true"></span>
              <span class="window-bar-v" aria-hidden="true"></span>
              <p class="window-hand">Dikkat edersen eğer.. arkandayım</p>
            </div>
            <span class="window-gleam" aria-hidden="true"></span>
          </div>
          <span class="window-sill" aria-hidden="true"></span>
        </div>
        <svg class="canvas-doodle canvas-doodle-eye" width="96" height="54" viewBox="0 0 96 54" fill="none" aria-hidden="true">
          <path d="M4 27C18 10 33 4 48 4s30 6 44 23C78 44 63 50 48 50S18 44 4 27z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="48" cy="27" r="8.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M48 4V0M70 9l4-5M26 9l-4-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </section>

      {{- if .Content }}
      <div class="canvas-prose">{{ .Content }}</div>
      {{- end }}

      <p class="canvas-sign" aria-hidden="true">k.</p>
    </div>
  </div>
</article>

<script>
  (function () {
    var stage = document.querySelector("[data-canvas]");
    if (!stage) return;

    var win = stage.querySelector("[data-window]");
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // is-ready yalnızca betik çalıştığında eklenir; betik yoksa her şey
    // olduğu gibi, gizlenmeden görünür.
    stage.classList.add("is-ready");
    if (win) win.classList.add("is-ready");

    function wake(el) {
      if (el) el.classList.add("is-awake");
    }

    if (!("IntersectionObserver" in window)) {
      wake(stage);
      wake(win);
      return;
    }

    var seen = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        wake(entry.target);
        seen.unobserve(entry.target);
      });
    }, { threshold: 0.2 });

    seen.observe(stage);
    if (win) seen.observe(win);

    // İmleç pencereye yaklaştıkça arkadaki gölge biraz kıpırdar.
    var shadow = stage.querySelector("[data-silhouette]");
    if (win && shadow && !reduced && window.matchMedia("(hover: hover)").matches) {
      win.addEventListener("pointermove", function (event) {
        var box = win.getBoundingClientRect();
        var dx = (event.clientX - box.left) / box.width - 0.5;
        var dy = (event.clientY - box.top) / box.height - 0.5;
        shadow.style.setProperty("--shadow-shift-x", (dx * -14).toFixed(2) + "px");
        shadow.style.setProperty("--shadow-shift-y", (dy * -8).toFixed(2) + "px");
        win.classList.add("is-close");
      });
      win.addEventListener("pointerleave", function () {
        shadow.style.setProperty("--shadow-shift-x", "0px");
        shadow.style.setProperty("--shadow-shift-y", "0px");
        win.classList.remove("is-close");
      });
    }
  })();
</script>
{{- end -}}
